<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2f6fcf">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), gyroscope=(), magnetometer=(), accelerometer=(), payment=(), usb=(), midi=(), bluetooth=(), serial=(), interest-cohort=(), idle-detection=(), screen-wake-lock=(), picture-in-picture=(), fullscreen=(), clipboard-read=(), clipboard-write=()">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; connect-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none';">
  <title>Seclusa Weather - Offline</title>
  <link rel="stylesheet" href="css/style.css?v=0.5.24">
  <link rel="stylesheet" href="css/responsive.css?v=0.5.24">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .offline-box {
      background: var(--color-card);
      border: 1px solid var(--color-card-border);
      border-radius: var(--radius);
      padding: 3rem 2rem;
      backdrop-filter: blur(var(--blur));
      max-width: 400px;
    }
    .offline-box svg { margin-bottom: 1rem; opacity: 0.7; }
    .offline-box h2 { font-family: var(--font-heading); margin-bottom: 0.5rem; }
    .offline-box p { color: var(--color-text-muted); margin-bottom: 1.5rem; }
    .offline-box button {
      background: var(--color-card);
      border: 1px solid var(--color-card-border);
      color: var(--color-text);
      padding: 0.7rem 1.5rem;
      border-radius: 50px;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 600;
      backdrop-filter: blur(var(--blur));
    }
    .offline-box button:hover { background: var(--color-card-hover); }
  </style>
</head>
<body class="theme-clear">
  <div class="offline-box">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
    <h2>You're Offline</h2>
    <p>Seclusa Weather needs an internet connection to fetch weather data. Connect and try again.</p>
    <button id="retryBtn">Retry</button>
  </div>
  <script src="js/offline.js?v=0.5.24"></script>
</body>
</html>
